version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /packages/biome-config
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: '@biomejs/biome'
    commit-message:
      prefix: fix(biome-config)
