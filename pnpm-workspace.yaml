packages:
  - packages/*
allowBuilds:
  unrs-resolver: false

minimumReleaseAge: 1440

# multi-semantic-release imports `@visulima/fs/yaml`, which needs the optional
# peer `@visulima/yaml`, but does not declare it. Remove once fixed upstream.
packageExtensions:
  '@anolilab/multi-semantic-release@4.6.3':
    dependencies:
      '@visulima/yaml': 2.0.0

overrides:
  'minimatch@>=9.0.0 <9.0.7': ^9.0.7
  'postcss@<8.5.18': ^8.5.32
